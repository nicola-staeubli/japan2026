<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japan 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      min-height: 100vh;
      background: #fff;
      color: #111;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px;
      min-width: 240px;
      padding: 40px 28px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid #e8e8e8;
    }

    #sidebar h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 32px;
    }

    .nav-section {
      margin-bottom: 24px;
    }

    .nav-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 10px;
    }

    .nav-links {
      list-style: none;
    }

    .nav-links li {
      margin-bottom: 6px;
    }

    .nav-links a {
      text-decoration: none;
      color: #555;
      font-size: 0.85rem;
      line-height: 1.5;
      transition: color 0.15s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #111;
    }

    /* ── Main grid ── */
    #main {
      flex: 1;
      padding: 40px 32px;
      overflow-y: auto;
    }

    /* Masonry-style columns */
    .photo-grid {
      columns: 3 260px;
      column-gap: 8px;
    }

    .photo-grid .photo-item {
      break-inside: avoid;
      margin-bottom: 8px;
      cursor: pointer;
      overflow: hidden;
      background: #f0f0f0;
    }

    .photo-grid .photo-item img {
      width: 100%;
      display: block;
      transition: opacity 0.2s;
    }

    .photo-grid .photo-item img:hover {
      opacity: 0.88;
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #lightbox.open {
      display: flex;
    }

    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    #lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.15s;
    }

    #lightbox-close:hover {
      opacity: 1;
    }

    #lightbox-prev,
    #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.6;
      padding: 16px;
      transition: opacity 0.15s;
      user-select: none;
    }

    #lightbox-prev { left: 12px; }
    #lightbox-next { right: 12px; }

    #lightbox-prev:hover,
    #lightbox-next:hover {
      opacity: 1;
    }

    #lightbox-caption {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      #sidebar {
        display: none;
      }
      .photo-grid {
        columns: 2 140px;
      }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <h1><a href="index.html" style="text-decoration:none;color:inherit;">Japan 2026</a></h1>

  </ul>
</nav>

<!-- Main content -->

<div class="photo-grid" id="photo-grid"></div>

  <div id="about-panel" style="display:none; max-width:520px; line-height:1.75; font-size:0.95rem; color:#444;">
    <h2 style="font-size:1.1rem; font-weight:600; margin-bottom:16px; color:#111;">About this trip</h2>
    <p>

      of Kyoto, the deer park in Nara, and the floating torii gate of Miyajima.
      All photos taken with a Sony A7C II.
    </p>
    <p style="margin-top:14px; color:#999; font-size:0.82rem;">March 2024</p>
  </div>
</main>

  // ─────────────────────────────────────────────
  // Build sidebar album links
  // ─────────────────────────────────────────────
  const albumNav = document.getElementById("album-nav");
  albums.forEach(({ key, label }) => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="#" data-album="${key}">${label}</a>`;
    albumNav.appendChild(li);
  });

  // ─────────────────────────────────────────────
  // Render grid
  // ─────────────────────────────────────────────
  let currentAlbum = "all";
  let currentPhotos = [];
  let lightboxIndex = 0;

  function renderGrid(albumKey) {
    currentAlbum = albumKey;
    currentPhotos = albumKey === "all" ? photos : photos.filter(p => p.album === albumKey);

    const grid = document.getElementById("photo-grid");
    grid.innerHTML = "";

    currentPhotos.forEach((photo, i) => {
      const item = document.createElement("div");
      item.className = "photo-item";
      const img = document.createElement("img");
      img.src = photo.src;
      img.alt = photo.alt;
      img.loading = "lazy";
      img.addEventListener("click", () => openLightbox(i));
      item.appendChild(img);
      grid.appendChild(item);
    });
  }

  // ─────────────────────────────────────────────
  // Navigation
  // ─────────────────────────────────────────────
  function setActiveLink(key) {
    document.querySelectorAll("[data-album]").forEach(l => {
      l.classList.toggle("active", l.dataset.album === key);
    });
  }

  document.getElementById("album-nav").addEventListener("click", e => {
    const link = e.target.closest("[data-album]");
    if (!link) return;
    e.preventDefault();
    const key = link.dataset.album;
    setActiveLink(key);
    renderGrid(key);
  });

  // ─────────────────────────────────────────────
  // Lightbox
  // ─────────────────────────────────────────────
  const lightbox    = document.getElementById("lightbox");
  const lbImg       = document.getElementById("lightbox-img");
  const lbCaption   = document.getElementById("lightbox-caption");

  function openLightbox(index) {
    lightboxIndex = index;
    showLightboxPhoto();
    lightbox.classList.add("open");
  }

  function showLightboxPhoto() {
    const p = currentPhotos[lightboxIndex];
    lbImg.src = p.src;
    lbImg.alt = p.alt;
    lbCaption.textContent = `${p.alt}  ·  ${lightboxIndex + 1} / ${currentPhotos.length}`;
  }

  document.getElementById("lightbox-close").addEventListener("click", () => {
    lightbox.classList.remove("open");
  });

  document.getElementById("lightbox-prev").addEventListener("click", () => {
    lightboxIndex = (lightboxIndex - 1 + currentPhotos.length) % currentPhotos.length;
    showLightboxPhoto();
  });

  document.getElementById("lightbox-next").addEventListener("click", () => {
    lightboxIndex = (lightboxIndex + 1) % currentPhotos.length;
    showLightboxPhoto();
  });

  lightbox.addEventListener("click", e => {
    if (e.target === lightbox) lightbox.classList.remove("open");
  });

  document.addEventListener("keydown", e => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "ArrowLeft")  { lightboxIndex = (lightboxIndex - 1 + currentPhotos.length) % currentPhotos.length; showLightboxPhoto(); }
    if (e.key === "ArrowRight") { lightboxIndex = (lightboxIndex + 1) % currentPhotos.length; showLightboxPhoto(); }
    if (e.key === "Escape")     { lightbox.classList.remove("open"); }
  });

  // ─────────────────────────────────────────────
  // Init
  // ─────────────────────────────────────────────
  setActiveLink("art-calligraphy");
  renderGrid("art-calligraphy");
</script>
